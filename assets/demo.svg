<title id="ttl">Offsite Planner in Copilot Cowork</title>
<desc id="dsc">Animated example: you ask Cowork to plan a June 2027 offsite. It finds 10 people in Budapest, London, Warsaw and Lisbon, picks 15 to 17 June 2027 without public holidays, ranks Prague, Nice and Split, and prepares an Excel comparison, a vote email draft and a calendar hold for your approval.</desc>
